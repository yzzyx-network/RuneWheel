<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RuneScape Activity Wheel</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>RuneScape Activity Wheel</h1>
      <p class="subtitle">Spin to decide your next adventure</p>
    </header>

    <main class="main">
      <section class="wheel-section">
        <div class="wheel-container">
          <canvas id="wheelCanvas" width="500" height="500"></canvas>
          <div class="pointer"></div>
        </div>
        <button id="spinBtn" class="spin-btn">SPIN</button>
        <div id="result" class="result hidden">
          <span class="result-label">Selected:</span>
          <span id="resultText" class="result-text"></span>
          <span id="resultTag" class="result-tag"></span>
        </div>
      </section>

      <aside class="sidepanel">
        <h2>Options</h2>
        
        <form id="addForm" class="add-form">
          <input type="text" id="optionName" placeholder="Activity name..." required maxlength="40" autocomplete="off">
          <select id="optionTag" required>
            <option value="" disabled selected>Tag...</option>
            <option value="boss">Boss</option>
            <option value="skilling">Skilling</option>
            <option value="other">Other</option>
          </select>
          <button type="submit" class="add-btn">Add</button>
        </form>

        <div class="filter-bar">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="boss">Boss</button>
          <button class="filter-btn" data-filter="skilling">Skilling</button>
          <button class="filter-btn" data-filter="other">Other</button>
        </div>

        <ul id="optionsList" class="options-list"></ul>

        <div class="sidepanel-footer">
          <button id="clearBtn" class="clear-btn">Clear All</button>
          <p class="hint">Options are saved locally</p>
        </div>
      </aside>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
