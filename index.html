<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RuneScape Activity Wheel</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body data-theme="osrs">
  <div class="app">
    <header class="header">
      <button type="button" id="themeToggle" class="theme-toggle" title="Switch between OSRS and Modern theme" aria-label="Switch theme">
        <span class="theme-toggle-track">
          <span class="theme-toggle-thumb"></span>
        </span>
        <span class="theme-toggle-text" id="themeToggleText">OSRS</span>
      </button>
      <h1>RuneScape Activity Wheel</h1>
      <p class="subtitle">Spin the wheel of Gielinor — choose your next adventure</p>
    </header>

    <main class="main">
      <section class="wheel-section">
        <div class="wheels-row">
          <div class="wheel-container main-wheel">
            <canvas id="wheelCanvas" width="500" height="500"></canvas>
            <div class="pointer"></div>
            <span class="wheel-label">Main</span>
          </div>

          <div id="subWheelWrap" class="wheel-container sub-wheel hidden">
            <canvas id="subWheelCanvas" width="280" height="280"></canvas>
            <div class="pointer sub-pointer"></div>
            <span class="wheel-label">Sub</span>
          </div>
        </div>

        <button id="spinBtn" class="spin-btn">SPIN</button>

        <div id="result" class="result hidden">
          <span class="result-label">Selected:</span>
          <div class="result-main-line">
            <span id="resultText" class="result-text"></span>
            <span id="resultTag" class="result-tag"></span>
          </div>
          <div id="resultSubLine" class="result-sub-line hidden">
            <span class="result-arrow">→</span>
            <span id="resultSubText" class="result-sub-text"></span>
          </div>
        </div>
      </section>

      <aside class="sidepanel">
        <h2>Options</h2>
        
        <form id="addForm" class="add-form">
          <input type="text" id="optionName" placeholder="Activity name..." required maxlength="40" autocomplete="off">
          <div class="tag-row">
            <select id="optionTag" required>
              <!-- filled by JS -->
            </select>
            <button type="button" id="newTagBtn" class="new-tag-btn" title="Create custom tag">+</button>
          </div>
          <button type="submit" class="add-btn">Add</button>
        </form>

        <div class="filter-row">
          <div id="filterBar" class="filter-bar">
            <!-- filled by JS -->
          </div>
          <button type="button" id="manageTagsBtn" class="manage-tags-btn" title="Manage tags">⚙</button>
        </div>

        <ul id="optionsList" class="options-list"></ul>

        <div class="sidepanel-footer">
          <button id="clearBtn" class="clear-btn">Clear All</button>
          <p class="hint">Options, tags &amp; subs saved locally</p>
        </div>
      </aside>
    </main>
  </div>

  <!-- Create tag modal -->
  <div id="tagModal" class="modal hidden">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card">
      <h3>Create custom tag</h3>
      <form id="tagForm">
        <input type="text" id="newTagName" placeholder="Tag name..." required maxlength="20" autocomplete="off">
        <div class="modal-actions">
          <button type="button" class="modal-cancel" data-close>Cancel</button>
          <button type="submit" class="modal-confirm">Create</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Manage tags modal -->
  <div id="manageTagsModal" class="modal hidden">
    <div class="modal-backdrop" data-close-manage></div>
    <div class="modal-card modal-card-wide">
      <h3>Manage tags</h3>
      <p class="modal-hint">Built-in tags cannot be deleted. Deleting a custom tag reassigns its activities to <strong>Other</strong>.</p>
      <ul id="manageTagsList" class="manage-tags-list"></ul>
      <div class="modal-actions">
        <button type="button" class="modal-cancel" data-close-manage>Close</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
